<style>
:root {
  --bg: #0a0e14;
  --card: #171e2a;
  --card-2: #1c2533;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.16);
  --text: #f3f5f7;
  --muted: #8b95a7;
  --red: #f14545;
  --cyan: #3ad3e8;
  --teal: #3ecfad;
  --amber: #e0b15c;
  --violet: #9b8cff;
  --work: #3ad3e8;
  --home: #e08a5a;
  --holiday: #e0b15c;
  --night: #9b8cff;
  --radius: 20px;
  --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", YuGothic, Meiryo, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html {
  color-scheme: dark;
  background: var(--bg);
}
body {
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(1000px 480px at 15% -8%, rgba(58, 211, 232, 0.09), transparent 55%),
    radial-gradient(800px 420px at 110% 0%, rgba(241, 69, 69, 0.06), transparent 50%),
    linear-gradient(180deg, #111820 0%, #0a0e14 42%, #0a0e14 100%);
  min-height: 100dvh;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; height: auto; display: block; }
button, input { font-family: inherit; }
a { color: var(--cyan); }

.page {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: 20px 16px 32px;
  padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(32px, env(safe-area-inset-bottom));
}

.kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
  color: var(--cyan);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.14em;
}
.kicker::after {
  content: "";
  flex: 0 1 72px;
  height: 1px;
  background: var(--cyan);
  opacity: 0.7;
}

header.hero {
  margin-bottom: 20px;
}
header.hero h1 {
  margin: 0;
  font-size: clamp(1.28rem, 4.6vw, 2rem);
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.35;
}
.sub {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.95rem;
  font-weight: 500;
}
.credit {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 0.8rem;
}

.status {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 14px;
  margin: 0 0 16px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 0.82rem;
}
.status b { font-weight: 700; color: var(--cyan); }
.path {
  color: var(--muted);
  font-size: 0.78rem;
  word-break: break-word;
}
.path:empty { display: none; }

.layout {
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.card {
  background: linear-gradient(180deg, #1b2330 0%, #151b26 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 18px 18px;
  min-width: 0;
}
.card.enter {
  animation: rise 0.32s ease;
}
@keyframes rise {
  from { transform: translateY(8px); }
  to { transform: translateY(0); }
}

.pill-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px 4px 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line-strong);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.pill .num {
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--accent, var(--cyan));
  color: #0a0e14;
  font-size: 0.78rem;
}
.pill.cat-start { --accent: var(--teal); }
.pill.cat-work { --accent: var(--work); }
.pill.cat-home { --accent: var(--home); }
.pill.cat-holiday { --accent: var(--holiday); }
.pill.cat-night { --accent: var(--night); }
.pill.cat-rest { --accent: var(--muted); }
.pill.cat-spy { --accent: var(--red); }
.pill.cat-shiro { --accent: var(--teal); }

.art-wrap {
  display: flex;
  justify-content: center;
  margin: 4px 0 18px;
}
.art-wrap img {
  width: min(220px, 64vw);
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 18px;
  background: #efe8dc;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
}
.card.is-goal .art-wrap img,
.card.is-start .art-wrap img {
  width: min(240px, 68vw);
}

.q-text {
  margin: 0 0 20px;
  font-size: 1.08rem;
  font-weight: 700;
  line-height: 1.7;
  letter-spacing: 0.02em;
}
.goal-title {
  margin: 0 0 8px;
  text-align: center;
  font-size: clamp(2rem, 8vw, 2.8rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.06em;
}
.goal-title.spy { color: var(--red); }
.goal-title.shiro { color: var(--teal); }
.goal-sub {
  margin: 0 0 22px;
  text-align: center;
  color: var(--text);
  font-size: 1rem;
  font-weight: 500;
}
.rest-title {
  margin: 0 0 6px;
  text-align: center;
  font-size: 1.6rem;
  font-weight: 700;
}
.rest-sub {
  margin: 0 0 22px;
  text-align: center;
  color: var(--muted);
}

.actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 48px;
  padding: 0.8rem 1rem;
  border-radius: 14px;
  border: 1px solid transparent;
  font-size: 0.98rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.3;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.btn:active { transform: scale(0.98); }
.btn:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}
.btn-yes {
  background: var(--red);
  color: #fff;
  box-shadow: 0 6px 16px rgba(241, 69, 69, 0.28);
}
.btn-yes:hover { background: #ff5252; }
.btn-no {
  background: transparent;
  color: var(--cyan);
  border-color: rgba(58, 211, 232, 0.7);
}
.btn-no:hover { background: rgba(58, 211, 232, 0.08); }
.btn-go {
  background: var(--cyan);
  color: #0a0e14;
  box-shadow: 0 6px 16px rgba(58, 211, 232, 0.22);
}
.btn-go:hover { background: #61dff0; }
.btn-again {
  background: transparent;
  color: var(--text);
  border-color: var(--line-strong);
}
.btn-again:hover { background: rgba(255, 255, 255, 0.04); }

.board-section h2 {
  margin: 0 0 12px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--muted);
}
.board-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.tile {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 64px;
  min-width: 0;
  padding: 8px;
  background: rgba(23, 30, 42, 0.9);
  border: 1px solid var(--line);
  border-radius: 14px;
  transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
}
.tile img {
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  border-radius: 10px;
  object-fit: cover;
  background: #efe8dc;
}
.tile .meta {
  min-width: 0;
}
.tile .who {
  display: block;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.tile .who .n {
  color: var(--text);
  margin-right: 4px;
}
.tile.is-current {
  border-color: var(--cyan);
  box-shadow: 0 0 0 1px var(--cyan), 0 0 18px rgba(58, 211, 232, 0.35);
  z-index: 1;
}
.tile.is-current.goal-spy,
.tile.goal-spy.is-current {
  border-color: var(--red);
  box-shadow: 0 0 0 1px var(--red), 0 0 18px rgba(241, 69, 69, 0.4);
}
.tile.is-current.goal-shiro {
  border-color: var(--teal);
  box-shadow: 0 0 0 1px var(--teal), 0 0 18px rgba(62, 207, 173, 0.35);
}
.tile.is-visited:not(.is-current) {
  border-color: rgba(58, 211, 232, 0.28);
}
.tile-dice {
  justify-content: center;
  background: rgba(23, 30, 42, 0.6);
  border-color: var(--line);
}
.tile-dice img { width: 56px; height: 56px; flex-basis: 56px; }
.tile-rest {
  grid-column: 1 / -1;
  justify-content: center;
  min-height: 44px;
  padding: 6px 10px;
}
.tile-rest img { display: none; }
.tile-ghost { visibility: hidden; min-height: 0; padding: 0; border: 0; background: none; }
.tile.goal-spy { border-color: rgba(241, 69, 69, 0.35); }
.tile.goal-shiro { border-color: rgba(62, 207, 173, 0.35); }

footer.site {
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.72rem;
  letter-spacing: 0.02em;
  line-height: 1.6;
}
footer.site .brand {
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #c5ccd6;
}
footer.site .mf { color: var(--cyan); font-weight: 700; white-space: nowrap; }
@media (max-width: 430px) {
  footer.site { font-size: 0.68rem; }
}

#live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
#autotest-report {
  display: none;
  margin-top: 16px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 12px;
  white-space: pre-wrap;
  color: #cfe;
}

@media (min-width: 640px) {
  .page { padding: 32px 28px 48px; }
  .actions { flex-direction: row; }
  .btn { flex: 1 1 0; }
  .q-text { font-size: 1.2rem; }
  .art-wrap img { width: 240px; }
  .board-grid { gap: 10px; }
}

@media (min-width: 960px) {
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.9fr);
    gap: 36px;
    align-items: start;
  }
  .board-section { position: sticky; top: 24px; }
  .card { padding: 28px 28px 22px; }
  .art-wrap img { width: 260px; }
  .q-text { font-size: 1.28rem; }
}

@media (max-height: 700px) and (max-width: 639px) {
  .art-wrap { margin-bottom: 12px; }
  .art-wrap img { width: min(148px, 42vw); }
  header.hero { margin-bottom: 12px; }
  .q-text { font-size: 1rem; margin-bottom: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .card.enter { animation: none; }
  .tile, .btn { transition: none; }
}
</style>
</head>

      actions: [{ type: "reset", label: "もう一度", className: "btn-again" }]
    }
  };

  const playCard = document.getElementById("play-card");
  const nowLabel = document.getElementById("now-label");
  const pathLabel = document.getElementById("path-label");
  const live = document.getElementById("live");

  let current = "start";
  let trail = ["start"];

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function pathText() {
    return trail.map(function (id) {
      return NODES[id].label;
    }).join("  →  ");
  }

  function markBoard() {
    document.querySelectorAll("#board .tile[data-id]").forEach(function (el) {
      var id = el.getAttribute("data-id");
      el.classList.toggle("is-current", id === current);
      el.classList.toggle("is-visited", trail.indexOf(id) !== -1);
    });
  }

  function render(animate) {
    var node = NODES[current];
    var cat = node.cat || "";
    var pillInner = "";
    if (node.num) {
      pillInner = '<span class="num">' + esc(node.num) + "</span>" + esc(node.place);
    } else if (node.kind === "start") {
      pillInner = esc("ふりだし");
    } else if (node.kind === "rest") {
      pillInner = esc("1回休み");
    } else if (node.kind === "back") {
      pillInner = esc("⑦ 夜");
    } else if (node.kind === "goal") {
      pillInner = esc("あがり");
    }
    var html = "";
    html += '<div class="pill-row"><span class="pill cat-' + esc(cat) + '">' + pillInner + "</span></div>";
    if (node.icon) {
      html += '<div class="art-wrap"><img alt="" src="' + node.icon + '"></div>';
    }
    if (node.kind === "goal") {
      html += '<p class="goal-title ' + esc(node.id) + '">' + esc(node.title) + "</p>";
      if (node.text) html += '<p class="goal-sub">' + esc(node.text) + "</p>";
    } else if (node.kind === "rest" || node.kind === "back") {
      html += '<p class="rest-title">' + esc(node.title) + "</p>";
      if (node.text) html += '<p class="rest-sub">' + esc(node.text) + "</p>";
    } else {
      html += '<p class="q-text">' + esc(node.text).replace(/\n/g, "<br>") + "</p>";
    }
    html += '<div class="actions">';
    node.actions.forEach(function (act, i) {
      html += '<button type="button" class="btn ' + act.className + '" data-i="' + i + '">' + esc(act.label) + "</button>";
    });
    html += "</div>";

    playCard.className = "card" + (node.kind === "goal" ? " is-goal" : "") + (node.kind === "start" ? " is-start" : "");
    playCard.innerHTML = html;
    if (animate !== false) {
      playCard.classList.remove("enter");
      void playCard.offsetWidth;
      playCard.classList.add("enter");
    }
    playCard.querySelectorAll("button[data-i]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        onAction(node.actions[Number(btn.getAttribute("data-i"))]);
      });
    });

    nowLabel.textContent = node.label;
    pathLabel.textContent = trail.length > 1 ? pathText() : "";
    live.textContent = node.label + "。" + (node.text || node.title || "");
    markBoard();
  }

  function go(id) {
    current = id;
    if (trail[trail.length - 1] !== id) trail.push(id);
    render(true);
  }

  function onAction(act) {
    if (act.type === "reset") {
      current = "start";
      trail = ["start"];
      render(true);
      return;
    }
    if (act.type === "back") {
      go("back");
      return;
    }
    go(act.to);
  }

  window.__sugoroku = {
    go: go,
    reset: function () { current = "start"; trail = ["start"]; render(false); },
    getState: function () { return { current: current, trail: trail.slice() }; },
    click: function (index) {
      var acts = NODES[current].actions;
      onAction(acts[index]);
    },
    nodes: NODES
  };

  render(false);

  if (/[?&]autotest=1\b/.test(location.search)) {
    var report = document.getElementById("autotest-report");
    report.style.display = "block";
    var scenarios = [
      { name: "q1-yes q2-yes -> spy", clicks: [0, 0] },
      { name: "q1-yes q2-no q3-yes q4-yes -> spy", clicks: [0, 1, 0, 0] },
      { name: "q1-yes q2-no q3-yes q4-no rest q5-yes -> spy", clicks: [0, 1, 0, 1, 0, 0] },
      { name: "q1-no q3-no q5-no q6-yes -> spy", clicks: [1, 1, 1, 0] },
      { name: "q1-no q3-no q5-no q6-no q7-no -> shiro", clicks: [1, 1, 1, 1, 1] },
      { name: "q7-yes back to q4, then no to rest to q5", clicks: [1, 1, 1, 1, 0, 0, 1, 0] }
    ];
    var lines = [];
    var failed = 0;
    scenarios.forEach(function (sc) {
      window.__sugoroku.reset();
      // start screen: first click is はじめる unless clicks already account for it
      window.__sugoroku.click(0); // はじめる -> q1
      sc.clicks.forEach(function (i) { window.__sugoroku.click(i); });
      var st = window.__sugoroku.getState();
      lines.push(sc.name + " => " + st.current + " | " + st.trail.join(">"));
    });
    // explicit assertions
    function run(clicks) {
      window.__sugoroku.reset();
      window.__sugoroku.click(0);
      clicks.forEach(function (i) { window.__sugoroku.click(i); });
      return window.__sugoroku.getState();
    }
    var checks = [
      [run([0, 0]).current === "spy", "path A ends spy"],
      [run([0, 1, 0, 0]).current === "spy", "path B ends spy"],
      [run([0, 1, 0, 1, 0, 0]).current === "spy", "path C ends spy"],
      [run([0, 1, 0, 1, 0, 0]).trail.indexOf("rest") !== -1, "path C visits rest"],
      [run([1, 1, 1, 0]).current === "spy", "path D ends spy"],
      [run([1, 1, 1, 1, 1]).current === "shiro", "path E ends shiro"],
      [run([1, 1, 1, 1, 0]).current === "back", "path F lands on back interstitial"],
      [run([1, 1, 1, 1, 0, 0]).current === "q4", "path F continues to q4"],
      [run([1, 1, 1, 1, 0, 0, 1]).current === "rest", "from q4 no goes to rest"],
      [run([1, 1, 1, 1, 0, 0, 1, 0]).current === "q5", "rest continues to q5"]
    ];
    var stAgain = run([1, 1, 1, 1, 1]);
    var resetOk = stAgain.current === "shiro";
    if (resetOk) {
      window.__sugoroku.click(0);
      resetOk = window.__sugoroku.getState().current === "start";
    }
    checks.push([resetOk, "もう一度 resets to start"]);
    checks.forEach(function (c) {
      if (!c[0]) failed += 1;
      lines.push((c[0] ? "OK  " : "FAIL") + " " + c[1]);
    });
    lines.push(failed === 0 ? "ALL PASSED" : ("FAILED " + failed));
    report.textContent = lines.join("\n");
    document.title = (failed === 0 ? "AUTOTEST_OK" : "AUTOTEST_FAIL") + " " + document.title;
    window.__sugoroku.reset();
    render(false);
  }
})();
</script>
